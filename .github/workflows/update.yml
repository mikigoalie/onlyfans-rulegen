name: Generate dynamic rules

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-extract even if the revision is unchanged
        type: boolean
        default: false

permissions: {}

concurrency:
  group: rulegen-${{ github.ref }}
  cancel-in-progress: false

env:
  CURL_IMPERSONATE_VERSION: v2.2.3
  CURL_IMPERSONATE_SHA256: ca7c8aae49e33260d3a2400db16c7737aaf04692d606a843502056b42990f989
  CURL_BIN: ./curl-impersonate/curl_chrome150

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      revision: ${{ steps.fetch.outputs.revision }}
      error: ${{ steps.test.outputs.error || steps.fetch.outputs.error }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "26"
        cache: "npm"

    - name: Build and test against every committed sample
      id: test
      run: |
        set -euo pipefail
        npm ci
        if ! npm test 2>&1 | tee test.log; then
          failed=$(grep -E '^✖ ' test.log | sort -u | head -5 | tr '\n' ' ' || true)
          echo "error=npm test failed: ${failed:-see the run log}" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Cache curl-impersonate
      id: cache-curl-impersonate
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./curl-impersonate
        key: ${{ runner.os }}-curl-impersonate-${{ env.CURL_IMPERSONATE_VERSION }}

    - name: Download curl-impersonate
      if: steps.cache-curl-impersonate.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        mkdir -p curl-impersonate
        curl -fsSL -o curl-impersonate.tar.gz \
          "https://github.com/lexiforest/curl-impersonate/releases/download/${CURL_IMPERSONATE_VERSION}/curl-impersonate-${CURL_IMPERSONATE_VERSION}.x86_64-linux-gnu.tar.gz"
        echo "${CURL_IMPERSONATE_SHA256}  curl-impersonate.tar.gz" | sha256sum -c -
        tar -xzf curl-impersonate.tar.gz -C ./curl-impersonate

    - name: Fetch, extract and verify
      id: fetch
      env:
        FORCE: ${{ inputs.force && '--force' || '' }}
      run: |
        set -euo pipefail
        node build/fetch.js --curl "$CURL_BIN" --out out $FORCE

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.fetch.outputs.changed == 'true'
      with:
        name: rules
        path: out/
        if-no-files-found: error

  publish:
    needs: extract
    if: needs.extract.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      error: ${{ steps.validate.outputs.error }}
    env:
      REVISION: ${{ needs.extract.outputs.revision }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "26"
        cache: "npm"

    - name: Build
      run: |
        set -euo pipefail
        npm ci
        npm run build

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: rules
        path: out

    - name: Validate rules without running the OnlyFans code
      id: validate
      run: |
        set -euo pipefail
        node build/validate.js out/dynamic-rules.json "out/samples/obfuscated/$REVISION.js"

    - name: Commit and push changes
      run: |
        set -euo pipefail
        cp out/dynamic-rules.json ./dynamic-rules.json
        cp "out/samples/obfuscated/$REVISION.js" samples/obfuscated/
        git add ./dynamic-rules.json "samples/obfuscated/$REVISION.js"
        if git diff --cached --quiet; then
          echo "Nothing changed; nothing to commit."
          exit 0
        fi
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"
        git commit -m "dynamic-rules.json: $REVISION"
        git push

  report:
    needs: [extract, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXTRACT_RESULT: ${{ needs.extract.result }}
        PUBLISH_RESULT: ${{ needs.publish.result }}
        ERROR: ${{ needs.extract.outputs.error || needs.publish.outputs.error }}
      with:
        script: |
          const label = "rulegen-failure";
          const { EXTRACT_RESULT: extract, PUBLISH_RESULT: publish, ERROR: error } = process.env;
          const results = [extract, publish];
          if (results.includes("cancelled")) return;
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const open = (await github.paginate(github.rest.issues.listForRepo, { ...context.repo, labels: label, state: "open" })).filter((i) => !i.pull_request);
          if (results.includes("failure")) {
            const body = `[Run ${context.runId}](${run}) on \`${context.ref}\` failed (extract: ${extract}, publish: ${publish}). dynamic-rules.json was not changed.\n\n\`\`\`\n${error || "No error message was captured; see the run log."}\n\`\`\``;
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title: "Dynamic rules generation is failing", labels: [label], body });
          } else
            for (const issue of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Resolved: [run ${context.runId}](${run}) succeeded.` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
            }
