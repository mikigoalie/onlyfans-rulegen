name: Generate dynamic rules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-extract even if the revision is unchanged
        type: boolean
        default: false

permissions: {}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      revision: ${{ steps.fetch.outputs.revision }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-node@v3
      with:
        node-version: "23"
        cache: "npm"

    - name: Build
      run: |
        set -euo pipefail
        npm ci
        npm run build

    - name: Cache curl-impersonate
      id: cache-curl-impersonate
      uses: actions/cache@v4
      with:
        path: ./curl-impersonate
        key: ${{ runner.os }}-curl-impersonate

    - name: Download curl-impersonate
      if: steps.cache-curl-impersonate.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        mkdir -p curl-impersonate
        wget https://github.com/lwthiker/curl-impersonate/releases/download/v0.6.1/curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz
        tar -xf curl-impersonate-v0.6.1.x86_64-linux-gnu.tar.gz -C ./curl-impersonate

    - name: Fetch, extract and verify
      id: fetch
      env:
        FORCE: ${{ inputs.force && '--force' || '' }}
      run: |
        set -euo pipefail
        node build/fetch.js --curl ./curl-impersonate/curl_chrome116 --out out $FORCE

    - uses: actions/upload-artifact@v4
      if: steps.fetch.outputs.changed == 'true'
      with:
        name: rules
        path: out/
        if-no-files-found: error

  publish:
    needs: extract
    if: needs.extract.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REVISION: ${{ needs.extract.outputs.revision }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v3
      with:
        node-version: "23"
        cache: "npm"

    - name: Build
      run: |
        set -euo pipefail
        npm ci
        npm run build

    - uses: actions/download-artifact@v4
      with:
        name: rules
        path: out

    - name: Validate rules without running the OnlyFans code
      run: |
        set -euo pipefail
        node build/validate.js out/dynamic-rules.json

    - name: Commit and push changes
      run: |
        set -euo pipefail
        cp out/dynamic-rules.json ./dynamic-rules.json
        git add ./dynamic-rules.json
        if git diff --cached --quiet; then
          echo "dynamic-rules.json is unchanged; nothing to commit."
          exit 0
        fi
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"
        git commit -m "dynamic-rules.json: $REVISION"
        git push
